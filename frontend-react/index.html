    <title>Daily Code Snippet</title>
    <script>
      // Sets data-theme before first paint so there's no flash of the
      // default (Paper) theme before React/ThemeContext mounts and
      // corrects it. Kept in sync with ThemeContext.jsx's THEMES/migration
      // logic — old binary "light"/"dark" values (pre-6-theme redesign)
      // map to their closest new theme.
      (function () {
        var VALID = ["midnight", "solar", "forest", "lavender", "ocean", "paper"];
        var stored = localStorage.getItem("theme");
        var MIGRATE = { light: "paper", dark: "midnight" };
        var theme = MIGRATE[stored] || (VALID.indexOf(stored) !== -1 ? stored : "paper");
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
